[package]
name = "the-os-gitui"
version = "0.3.0"
description = "Free, open-source Git GUI"
license = "MIT"
edition = "2021"

[lib]
name = "osgitui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
which = "8.0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
